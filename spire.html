<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spire Jr" />
  <title>Slay the Spire Jr.</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/app_icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="assets/app_icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/app_icon.png" />
  <link rel="stylesheet" href="spire.css?v=20260313dt" />
</head>
<body>
  <div class="wrap">
    <div class="arena">
      <div id="arenaPanel" class="panel arena-panel">
        <div class="arena-hud">
          <div class="combatant combatant-hero">
            <div class="meta-row">
              <span>Hero</span>
              <span id="fightCounter">Fight 1 of 3</span>
            </div>

            <div class="meter-row">
              <span class="meter-label">❤️</span>
              <div class="hpbar"><div id="playerHpFill" class="fill hp"></div></div>
              <span id="playerHpText" class="meter-value">20 / 20</span>
            </div>

            <div class="meter-row">
              <span class="meter-label">🛡️</span>
              <div class="hpbar"><div id="playerBlockFill" class="fill block"></div></div>
              <span id="playerBlockText" class="meter-value">0</span>
            </div>

          </div>

          <div class="combatant combatant-enemy">
            <div class="meta-row">
              <span>Bad Guy</span>
              <span></span>
            </div>

            <div class="meter-row">
              <span id="enemyName" class="meter-label">🟢 Blob</span>
              <div class="hpbar"><div id="enemyHpFill" class="fill enemy"></div></div>
              <span id="enemyHpText" class="meter-value">14 / 14</span>
            </div>
          </div>
        </div>

        <div id="fightStage" class="fight-stage">
          <div id="heroHpIcons" class="combat-hp-icons hero-hp-icons" aria-hidden="true"></div>
          <div class="hero-art" id="heroArt">
            <img id="heroBase" class="hero-base-img" src="assets/hero.png" alt="Hero" />
            <div id="heroNameStage" class="combatant-name-stage hero-name-stage">The Hero!</div>
          </div>
          <div class="enemy-art" id="enemyArt">
            <img id="enemyBaseImg" class="enemy-base-img" src="" alt="Enemy" />
            <span id="enemyBase" class="enemy-base">🟢</span>
            <div class="intent enemy-intent" id="enemyIntent">🗡️ 2</div>
            <div id="enemyNameStage" class="combatant-name-stage enemy-name-stage">Enemy</div>
          </div>
          <div id="heroBlockIcons" class="hero-block-icons" aria-hidden="true"></div>
          <div id="enemyDamageIcons" class="enemy-damage-icons" aria-hidden="true"></div>
          <div id="enemyHpIcons" class="combat-hp-icons enemy-hp-icons" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div id="battleRow" class="battle-row">
        <div class="pile-column">
          <div id="energyRow" class="energy-row">⚡⚡⚡</div>
          <button id="deckCounter" class="btn btn-secondary pile-btn">Deck 8</button>
          <button id="drawCounter" class="btn btn-secondary pile-btn">Draw 8</button>
          <button id="discardCounter" class="btn btn-secondary pile-btn">Discard 0</button>
        </div>
        <div id="hand" class="hand"></div>
        <button id="endTurnBtn" class="btn btn-primary end-turn-side">End Turn</button>
      </div>
    </div>
  </div>

  <div id="rewardChestOverlay" class="reward-chest-overlay hidden" aria-hidden="true">
    <div class="reward-chest-backdrop"></div>
    <div class="reward-chest-stage">
      <img id="rewardChestImage" class="reward-chest-image" src="assets/closed_treasure.png" alt="Treasure chest" />
      <div id="rewardPrompt" class="reward-prompt">Click the chest to open your reward</div>
      <div id="rewardChoices" class="reward-choices"></div>
    </div>
  </div>

  <div id="youWonOverlay" class="you-won-overlay hidden" aria-hidden="true">
    <div class="you-won-backdrop"></div>
    <div class="you-won-stage">
      <div class="you-won-sparkles" aria-hidden="true">
        <span style="--x: 6%; --y: 10%; --s: 1.1; --d: 0ms;"></span>
        <span style="--x: 14%; --y: 28%; --s: 0.9; --d: 180ms;"></span>
        <span style="--x: 22%; --y: 14%; --s: 1.3; --d: 460ms;"></span>
        <span style="--x: 30%; --y: 34%; --s: 1.0; --d: 920ms;"></span>
        <span style="--x: 40%; --y: 12%; --s: 1.5; --d: 360ms;"></span>
        <span style="--x: 52%; --y: 30%; --s: 0.95; --d: 1120ms;"></span>
        <span style="--x: 61%; --y: 11%; --s: 1.2; --d: 250ms;"></span>
        <span style="--x: 70%; --y: 32%; --s: 1.05; --d: 760ms;"></span>
        <span style="--x: 80%; --y: 15%; --s: 1.4; --d: 540ms;"></span>
        <span style="--x: 90%; --y: 29%; --s: 0.9; --d: 980ms;"></span>
        <span style="--x: 16%; --y: 48%; --s: 1.2; --d: 420ms;"></span>
        <span style="--x: 86%; --y: 52%; --s: 1.1; --d: 840ms;"></span>
      </div>
      <img id="youWonImage" class="you-won-image" src="assets/you_won.png" alt="YOU WON!" />
      <div class="you-won-title">YOU WON!</div>
      <button id="fightAgainBtn" class="btn btn-primary you-won-restart" type="button">Fight Again</button>
    </div>
  </div>

  <div id="youDiedOverlay" class="you-died-overlay hidden" aria-hidden="true">
    <div class="you-died-backdrop"></div>
    <div class="you-died-stage">
      <div class="you-died-skull" aria-hidden="true">💀</div>
      <div class="you-died-title">YOU DIED</div>
      <button id="fightAgainBtnDied" class="btn btn-primary you-died-restart" type="button">Fight Again</button>
    </div>
  </div>

  <div id="pileModal" class="pile-modal hidden" aria-hidden="true">
    <div id="pileModalBackdrop" class="pile-modal-backdrop"></div>
    <div class="pile-modal-card" role="dialog" aria-modal="true" aria-labelledby="pileModalTitle">
      <div class="pile-modal-header">
        <h2 id="pileModalTitle" class="pile-modal-title">Deck</h2>
        <button id="pileModalClose" class="btn btn-secondary pile-modal-close" type="button">Close</button>
      </div>
      <div id="pileModalMeta" class="pile-modal-meta"></div>
      <div id="pileModalList" class="pile-modal-list"></div>
    </div>
  </div>

  <script src="spire.js?v=20260313dt"></script>
</body>
</html>
